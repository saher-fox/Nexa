herename: Build Android APK
on:
  push:
    branches:
      - main
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً بزر ضغط

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      # 1. جلب الكود من المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      # 3. تثبيت بيئة الجافا المطلوبة للأندرويد
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. تثبيت حزم وأدوات المشروع الأساسية
      - name: Install dependencies
        run: |
          npm install

      # 5. الخطوة السحرية: توليد مجلد أندرويد الأصلي تلقائياً سحابياً
      - name: Prebuild Expo Project (Generate Native Android Folder)
        run: |
          npx expo prebuild --platform android --no-install

      # 6. تجميع وبناء ملف الـ APK محلياً داخل السيرفر
      - name: Build Android APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 7. استخراج ملف الـ APK النهائي وتقديمه لك كرابط تحميل مباشر
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-counter-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
